<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>who-am-i</title>

    <link rel="stylesheet" href="who-am-i.css" />
    <link
      rel="stylesheet"
      href="./swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body>
    <!-- page start -->
    <div class="page">
      <!-- title -->
      <div class="title">
        <h1 data-lang-key="title">i am jain</h1>
      </div>

      <!-- nav start -->
      <nav>
        <div class="home">
          <a href="index.html">
            <img class="home-btn" src="./assets/image/home-btn.png" alt="" />
          </a>
        </div>

        <div class="lang-btn">
          <button class="english">E</button>
          <button class="hindi">H</button>
          <button class="Gujrati">G</button>
        </div>
      </nav>
      <!-- nav end -->

      <!-- main start -->
      <div class="main">
        <!-- left container -->
        <div class="left">
          <div class="container">
            <!-- circle + page nav -->
            <div class="circle-container">
              <div class="circle">
                <img src="./assets/image/circle.png" alt="" />
                <div class="sub-title sub-title-1">
                  <span data-lang-key="sub-title-1"
                    >Who <br />
                    am I?</span
                  >
                </div>
              </div>

              <div class="circle-controls">
                <a class="prev" href="i-am-jain.html">
                  <i class="fa-solid fa-angle-left"></i>
                </a>
                <a class="next" href="i-am-jain.html">
                  <i class="fa-solid fa-angle-right"></i>
                </a>
              </div>
            </div>

            <!-- scroll area -->
            <div class="scripture-scroll-container">
              <div class="scripture-scroll">
                <!-- parchment behind -->
                <div class="parchment-card-background">
                  <div class="parchment-card">
                    <img
                      class="perchment-1"
                      src="./assets/image/parchment-card.png"
                      alt=""
                    />

                    <!-- text swiper on top -->
                    <div class="parchment-content">
                      <div class="swiper textSwiper">
                        <div class="swiper-wrapper">
                          <div class="swiper-slide">
                            <p data-lang-key="slide-1.1" class="perchment-text">
                              I am a Jeev
                            </p>
                          </div>

                          <div class="swiper-slide">
                            <p data-lang-key="slide-1.3" class="perchment-text">
                              I am a Human
                            </p>
                          </div>

                          <div class="swiper-slide">
                            <p data-lang-key="slide-1.2" class="perchment-text">
                              I am a Human
                            </p>
                          </div>
                        </div>
                      </div>

                      <!-- buttons around parchment -->
                      <button class="p-prev nav-btn" type="button">
                        <i class="fa-solid fa-arrow-left"></i>
                      </button>

                      <button class="p-next nav-btn" type="button">
                        <i class="fa-solid fa-arrow-right"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- scroll above -->
                <div class="roll">
                  <img src="./assets/image/scripture1.png" alt="" />
                  <img src="./assets/image/scripture2.png" alt="" />
                </div>
              </div>
            </div>

            <div class="left-pagination swiper-pagination"></div>
          </div>
        </div>

        <!-- right container -->
        <div class="right">
          <div class="right-img-container">
            <div class="star-wrap">
              <img
                class="star-border"
                src="./assets/image/star-img.png"
                alt=""
              />

              <div class="star-mask">
                <div class="swiper mediaSwiper">
                  <div class="swiper-wrapper">
                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/who-am-i/1.mp4"
                        muted
                        loop
                        playsinline
                        preload="metadata"
                      ></video>
                    </div>

                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/who-am-i/3.mp4"
                        muted
                        loop
                        playsinline
                        preload="metadata"
                      ></video>
                    </div>

                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/who-am-i/2.mp4"
                        muted
                        loop
                        playsinline
                        preload="metadata"
                      ></video>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <img class="character" src="./assets/image/namste.png" alt="" />
          </div>
        </div>
      </div>
      <!-- main end -->
    </div>
    <!-- page end -->

    <script src="./swiper-bundle.min.js"></script>
    <script src="script1.js"></script>

    <script>
      // =========================
      // Page Audio Effects
      // Circle click -> curtain.mp3
      // Circle container navigation -> transition.mp3
      // Parchment navigation buttons -> swipe.mp3
      // Home button -> pop.mp3
      // English button -> Eng.mpeg
      // Hindi button -> Hin.mpeg
      // Gujarati button -> Guj.mpeg
      // =========================

      const curtainAudio = new Audio("./assets/audio/curtain.mp3");
      const transitionAudio = new Audio("./assets/audio/transition.mp3");
      const swipeAudio = new Audio("./assets/audio/swipe.mp3");
      const popAudio = new Audio("./assets/audio/pop.mp3");

      const englishAudio = new Audio("./assets/audio/Eng.mpeg");
      const hindiAudio = new Audio("./assets/audio/Hin.mpeg");
      const gujratiAudio = new Audio("./assets/audio/Guj.mpeg");

      function stopAndPlay(audio) {
        audio.pause();
        audio.currentTime = 0;

        audio.play().catch((err) => {
          console.error("Audio play blocked:", err);
        });
      }

      // ===== Home button audio =====
      const homeBtnLink = document.querySelector(".home a");

      homeBtnLink?.addEventListener("click", (e) => {
        e.preventDefault();

        const targetLink = homeBtnLink.getAttribute("href");

        stopAndPlay(popAudio);

        // small delay so pop.mp3 can play before page changes
        setTimeout(() => {
          window.location.href = targetLink;
        }, 500);
      });

      // ===== Language buttons audio =====
      const englishBtn = document.querySelector(".english");
      const hindiBtn = document.querySelector(".hindi");
      const gujratiBtn = document.querySelector(".Gujrati");

      englishBtn?.addEventListener("click", () => {
        stopAndPlay(englishAudio);
      });

      hindiBtn?.addEventListener("click", () => {
        stopAndPlay(hindiAudio);
      });

      gujratiBtn?.addEventListener("click", () => {
        stopAndPlay(gujratiAudio);
      });

      // ===== Circle click audio =====
      const circleBtn = document.querySelector(".circle");

      circleBtn?.addEventListener("click", () => {
        stopAndPlay(curtainAudio);
      });

      // ===== Circle container navigation audio =====
      const circleNavButtons = document.querySelectorAll(
        ".circle-controls .prev, .circle-controls .next",
      );

      circleNavButtons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();

          const targetLink = btn.getAttribute("href");

          stopAndPlay(transitionAudio);

          // 2 seconds delay before page changes
          setTimeout(() => {
            window.location.href = targetLink;
          }, 2000);
        });
      });

      // ===== Parchment swiper navigation audio =====
      const parchmentNavButtons = document.querySelectorAll(".p-prev, .p-next");

      parchmentNavButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          stopAndPlay(swipeAudio);
        });
      });

      // =========================
      // Play star-videos ONLY when visible
      // - IntersectionObserver: pause/play based on scroll visibility
      // - Also respects the active swiper slide (only active slide's video plays)
      // - Also pauses when the browser tab itself is hidden
      // =========================

      const starVideos = Array.from(document.querySelectorAll(".star-video"));

      function isSlideActive(video) {
        const slide = video.closest(".swiper-slide");
        return slide ? slide.classList.contains("swiper-slide-active") : true;
      }

      function tryPlay(video) {
        // Only play if it's on the active slide, tab is visible, and it's intersecting
        if (
          isSlideActive(video) &&
          document.visibilityState === "visible" &&
          video.dataset.isVisible === "true"
        ) {
          video.play().catch(() => {});
        }
      }

      function pauseVideo(video) {
        video.pause();
      }

      const videoObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const video = entry.target;

            if (entry.isIntersecting) {
              video.dataset.isVisible = "true";
              tryPlay(video);
            } else {
              video.dataset.isVisible = "false";
              pauseVideo(video);
            }
          });
        },
        { threshold: 0.25 } // consider "visible" once at least 25% is in view
      );

      starVideos.forEach((video) => {
        video.dataset.isVisible = "false";
        videoObserver.observe(video);
      });

      // ===== Handle browser tab switching =====
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          starVideos.forEach(pauseVideo);
        } else {
          starVideos.forEach(tryPlay);
        }
      });

      // ===== Handle swiper slide changes (only active slide's video should play) =====
      // Works whether the mediaSwiper instance is exposed globally by script1.js
      // (e.g. window.mediaSwiper) or found via the DOM's swiper element instance.
      function bindMediaSwiperVideoControl() {
        const mediaSwiperEl = document.querySelector(".mediaSwiper");
        const swiperInstance =
          window.mediaSwiper || (mediaSwiperEl && mediaSwiperEl.swiper);

        if (!swiperInstance) {
          // script1.js may init swiper slightly after this script runs; retry shortly.
          setTimeout(bindMediaSwiperVideoControl, 200);
          return;
        }

        function refreshVideosForActiveSlide() {
          starVideos.forEach((video) => {
            if (isSlideActive(video)) {
              tryPlay(video);
            } else {
              pauseVideo(video);
            }
          });
        }

        swiperInstance.on("slideChange", refreshVideosForActiveSlide);
        swiperInstance.on("slideChangeTransitionEnd", refreshVideosForActiveSlide);

        // Run once immediately in case the active slide's video is already visible
        refreshVideosForActiveSlide();
      }

      bindMediaSwiperVideoControl();
    </script>
  </body>
</html>
