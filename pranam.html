<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <style>
      body {
        background-image: url("./assets/image/bg1.png");
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .lang-btn {
        position: fixed;
        right: 5%;
        top: 3vw;
        opacity: 1;
        transform: none;
        animation: enterRight var(--enter-dur) var(--enter-ease) 160ms forwards;
      }

      
  .pranam-video{
    position: absolute;
    left: 49.9%;
    top: 48.6%;
    background-image: url("./assets/images/pranam-bg-1.png");
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    transform: translate(-50%, -50%);
    width: 28vw;
    height: 28vw;
    border-radius: 50%;
    background-color: #f6f6f6;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    padding-right: 2.5vw;
  }

.pranam-video video {
    width: 90%;
    height: 83%;
    object-fit: cover;

    /* Very light feather on ALL edges */
    -webkit-mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        ),
        linear-gradient(
            to right,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        );

    -webkit-mask-composite: source-in;

    mask-image:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        ),
        linear-gradient(
            to right,
            transparent 0%,
            rgba(0, 0, 0, 0.8) 2%,
            rgba(0, 0, 0, 0.95) 4%,
            black 6%,
            black 90%,
            rgba(0, 0, 0, 0.95) 96%,
            rgba(0, 0, 0, 0.8) 98%,
            transparent 100%
        );

    mask-composite: intersect;

    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;

    -webkit-mask-size: 100% 100%;
    mask-size: 100% 100%;
}
    </style>
  </head>

  <body>
    <a href="what-is-my-duty.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <div class="lang-btn">
      <button class="english">E</button>
      <button class="hindi">H</button>
      <button class="Gujrati">G</button>
    </div>

    <div class="pranam-container">
      <div class="pranam-img">
        <div class="pranam-video">
          <video src="./assets/video/pranam.mp4" autoplay muted></video>
        </div>

        <span data-lang-key="pranam"></span>
        <img src="./assets/image/pranam.png" alt="" />
      </div>

      <a href="index.html" class="home-btn-1">
        <span data-lang-key="home"></span>
        <img src="./assets/image/pranam-home-btn.png" alt="" />
      </a>
    </div>

    <script src="./script.js"></script>
  <script src="djp.js"></script>
    <script>
      // =========================
      // Page Audio Effects
      // Page load -> pranam.mp3 (plays once, only on load)
      // Back button -> pop.mp3
      // Home button -> transition.mp3
      // English button -> Eng.mpeg
      // Hindi button -> Hin.mpeg
      // Gujarati button -> Guj.mpeg
      // =========================

      const pranamAudio = new Audio("./assets/audio/pranam.mp3");
      const popAudio = new Audio("./assets/audio/pop.mp3");
      const transitionAudio = new Audio("./assets/audio/transition.mp3");

      const englishAudio = new Audio("./assets/audio/Eng.mpeg");
      const hindiAudio = new Audio("./assets/audio/Hin.mpeg");
      const gujratiAudio = new Audio("./assets/audio/Guj.mpeg");

      function stopAndPlay(audio) {
        audio.pause();
        audio.currentTime = 0;

        audio.play().catch((err) => {
          console.error("Audio play blocked:", err);
        });
      }

      // ===== Play pranam.mp3 once on page load only =====
      window.addEventListener("load", () => {
        pranamAudio.currentTime = 0;

        pranamAudio.play().catch((err) => {
          console.error("Pranam audio autoplay blocked:", err);
        });
      });

      // ===== Back button audio =====
      const backBtn = document.querySelector(".back-btn");

      backBtn?.addEventListener("click", (e) => {
        e.preventDefault();

        const targetLink = backBtn.getAttribute("href");

        stopAndPlay(popAudio);

        // Small delay so pop.mp3 can play before page changes
        setTimeout(() => {
          window.location.href = targetLink;
        }, 500);
      });

      // ===== Home button audio =====
      const homeBtn = document.querySelector(".home-btn-1");

      homeBtn?.addEventListener("click", (e) => {
        e.preventDefault();

        const targetLink = homeBtn.getAttribute("href");

        stopAndPlay(transitionAudio);

        // 2 seconds delay before page changes
        setTimeout(() => {
          window.location.href = targetLink;
        }, 2000);
      });

      // ===== Language buttons audio =====
      const englishBtn = document.querySelector(".english");
      const hindiBtn = document.querySelector(".hindi");
      const gujratiBtn = document.querySelector(".Gujrati");

      englishBtn?.addEventListener("click", () => {
        stopAndPlay(englishAudio);
      });

      hindiBtn?.addEventListener("click", () => {
        stopAndPlay(hindiAudio);
      });

      gujratiBtn?.addEventListener("click", () => {
        stopAndPlay(gujratiAudio);
      });
    </script>
  </body>
</html>
