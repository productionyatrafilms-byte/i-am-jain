<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>i-am-jain</title>

    <link rel="stylesheet" href="what-is-my-duty.css" />
    <link
      rel="stylesheet"
      href="./swiper-bundle.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>

  <body>
    <!-- page start -->
    <div class="page">
      <!-- title -->
      <div class="title" style="">
        <h1 data-lang-key="title">i am jain</h1>
      </div>

      <!-- nav start -->
      <nav>
        <div class="home">
          <a href="index.html">
            <img class="home-btn" src="./assets/image/home-btn.png" alt="" />
          </a>
        </div>

        <div class="lang-btn">
          <button class="english">E</button>
          <button class="hindi">H</button>
          <button class="Gujrati">G</button>
        </div>
      </nav>
      <!-- nav end -->

      <!-- pranam link starts hidden; JS reveals it with a pop animation on the last slide -->
      <a href="pranam.html" class="pranam-link">
        <span data-lang-key="pranamz">Pranam</span>
      </a>

      <!-- main start -->
      <div class="main">
        <!-- left container -->
        <div class="left">
          <div class="container">
            <!-- circle + page nav -->
            <div class="circle-container">
              <div class="circle">
                <img src="./assets/image/circle.png" alt="" />
                <div class="sub-title sub-title-1">
                  <span data-lang-key="sub-title-3">What is my duty?</span>
                </div>
              </div>

              <div class="circle-controls">
                <a class="prev" href="i-am-jain.html">
                  <i class="fa-solid fa-angle-left"></i>
                </a>
                <a class="next" href="what-is-my-duty.html">
                  <i class="fa-solid fa-angle-right"></i>
                </a>
              </div>
            </div>

            <!-- scroll area -->
            <div class="scripture-scroll-container">
              <div class="scripture-scroll">
                <!-- parchment (behind) -->
                <div class="parchment-card-background">
                  <div class="parchment-card">
                    <img
                      class="perchment-1"
                      src="./assets/image/parchment-card.png"
                      alt=""
                    />

                    <!-- text swiper on top -->
                    <div class="parchment-content">
                      <div class="swiper textSwiper">
                        <div class="swiper-wrapper">
                          <div class="swiper-slide">
                            <p data-lang-key="slide-3.1" class="perchment-text">
                              Jainism is my Religion
                            </p>
                          </div>
                          <div class="swiper-slide">
                            <p data-lang-key="slide-3.2" class="perchment-text">
                              Arihnats are my Bhagwan
                            </p>
                          </div>
                          <div class="swiper-slide">
                            <p data-lang-key="slide-3.3" class="perchment-text">
                              Jain Sadhu are my Guru
                            </p>
                          </div>
                          <div class="swiper-slide">
                            <p data-lang-key="slide-3.4" class="perchment-text">
                              I am Balshravak - Balshravika
                            </p>
                          </div>
                          <div class="swiper-slide">
                            <p data-lang-key="slide-3.6" class="perchment-text">
                              I have got most powerful Mantra - Navkar Mantra
                            </p>
                          </div>
                        </div>
                      </div>

                      <!-- buttons around parchment -->
                      <button class="p-prev nav-btn" type="button">
                        <i class="fa-solid fa-arrow-left"></i>
                      </button>
                      <button class="p-next nav-btn" type="button">
                        <i class="fa-solid fa-arrow-right"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <!-- scroll (above) -->
                <div class="roll">
                  <img src="./assets/image/scripture1.png" alt="" />
                  <img src="./assets/image/scripture2.png" alt="" />
                </div>
              </div>
            </div>

            <div class="left-pagination swiper-pagination"></div>
          </div>
        </div>

        <!-- right container -->
        <div class="right">
          <div class="right-img-container">
            <div class="star-wrap">
              <img
                class="star-border"
                src="./assets/image/star-img.png"
                alt=""
              />

              <div class="star-mask">
                <div class="swiper mediaSwiper">
                  <div class="swiper-wrapper">
                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/what-is-my-duty/10.mp4"
                        autoplay
                        muted
                        loop
                        playsinline
                      ></video>
                    </div>
                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/what-is-my-duty/12.mp4"
                        autoplay
                        muted
                        loop
                        playsinline
                      ></video>
                    </div>
                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/what-is-my-duty/8.mp4"
                        autoplay
                        muted
                        loop
                        playsinline
                      ></video>
                    </div>
                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/what-is-my-duty/11.mp4"
                        autoplay
                        muted
                        loop
                        playsinline
                      ></video>
                    </div>
                    <div class="swiper-slide">
                      <video
                        class="star-video"
                        src="./assets/video/what-is-my-duty/13.mp4"
                        autoplay
                        muted
                        loop
                        playsinline
                      ></video>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <img class="character" src="./assets/image/namste.png" alt="" />
          </div>
        </div>
      </div>
      <!-- main end -->
    </div>
    <!-- page end -->

    <script src="./swiper-bundle.min.js"></script>
    <script src="script1.js"></script>
    <script>
      // =========================
      // Page Audio Effects
      // Circle click -> curtain.mp3
      // Circle container navigation -> transition.mp3
      // Parchment navigation buttons -> swipe.mp3
      // Home button -> pop.mp3
      // English button -> a.mp3
      // Hindi button -> b.mp3
      // Gujarati button -> c.mp3
      // =========================

      const curtainAudio = new Audio("./assets/audio/curtain.mp3");
      const transitionAudio = new Audio("./assets/audio/transition.mp3");
      const swipeAudio = new Audio("./assets/audio/swipe.mp3");
      const popAudio = new Audio("./assets/audio/pop.mp3");

      const englishAudio = new Audio("./assets/audio/Eng.mpeg");
      const hindiAudio = new Audio("./assets/audio/Hin.mpeg");
      const gujratiAudio = new Audio("./assets/audio/Guj.mpeg");

      function stopAndPlay(audio) {
        audio.pause();
        audio.currentTime = 0;

        audio.play().catch((err) => {
          console.error("Audio play blocked:", err);
        });
      }

      // ===== Home button audio =====
      const homeBtnLink = document.querySelector(".home a");

      homeBtnLink?.addEventListener("click", (e) => {
        e.preventDefault();

        const targetLink = homeBtnLink.getAttribute("href");

        stopAndPlay(popAudio);

        // Small delay so pop.mp3 can play before page changes
        setTimeout(() => {
          window.location.href = targetLink;
        }, 500);
      });

      // ===== Language buttons audio =====
      const englishBtn = document.querySelector(".english");
      const hindiBtn = document.querySelector(".hindi");
      const gujratiBtn = document.querySelector(".Gujrati");

      englishBtn?.addEventListener("click", () => {
        stopAndPlay(englishAudio);
      });

      hindiBtn?.addEventListener("click", () => {
        stopAndPlay(hindiAudio);
      });

      gujratiBtn?.addEventListener("click", () => {
        stopAndPlay(gujratiAudio);
      });

      // ===== Circle click audio =====
      const circleBtn = document.querySelector(".circle");

      circleBtn?.addEventListener("click", () => {
        stopAndPlay(curtainAudio);
      });

      // ===== Circle container navigation audio =====
      const circleNavButtons = document.querySelectorAll(
        ".circle-controls .prev, .circle-controls .next",
      );

      circleNavButtons.forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();

          const targetLink = btn.getAttribute("href");

          stopAndPlay(transitionAudio);

          // 2 seconds delay before page changes
          setTimeout(() => {
            window.location.href = targetLink;
          }, 2000);
        });
      });

      // ===== Parchment swiper navigation audio =====
      const parchmentNavButtons = document.querySelectorAll(".p-prev, .p-next");

      parchmentNavButtons.forEach((btn) => {
        btn.addEventListener("click", () => {
          stopAndPlay(swipeAudio);
        });
      });

      // ===== Last-slide handling: hide next-btn, reveal pranam-link with pop animation =====
      window.addEventListener("load", () => {
        const nextBtn = document.querySelector(".p-next");
        const textSwiperEl = document.querySelector(".textSwiper");
        const pranamLink = document.querySelector(".pranam-link");

        if (!nextBtn || !textSwiperEl || !textSwiperEl.swiper) return;

        const swiper = textSwiperEl.swiper;

        function isLastSlide() {
          return swiper.activeIndex === swiper.slides.length - 1;
        }

        function updateLastSlideUI() {
          if (isLastSlide()) {
            // hide the next button
            nextBtn.classList.add("is-hidden");

            // reveal pranam link with pop animation
            if (pranamLink) {
              pranamLink.classList.add("show");
            }
          } else {
            // show next button again
            nextBtn.classList.remove("is-hidden");

            // hide pranam link again
            if (pranamLink) {
              pranamLink.classList.remove("show");
            }
          }
        }

        // run once on load in case the swiper starts on the last slide
        updateLastSlideUI();

        swiper.on("slideChange", updateLastSlideUI);
        swiper.on("transitionEnd", updateLastSlideUI);
        swiper.on("reachEnd", updateLastSlideUI);

        // ===== Redirect to pranam.html when clicking p-next on the last slide =====
        nextBtn.addEventListener(
          "click",
          (e) => {
            if (isLastSlide()) {
              e.preventDefault();
              e.stopPropagation();
              e.stopImmediatePropagation();

              stopAndPlay(swipeAudio);

              // Small delay so swipe.mp3 can play before redirect
              setTimeout(() => {
                window.location.assign("pranam.html");
              }, 500);
            }
          },
          true,
        );
      });
    </script>
  </body>
</html>
